# ---------------------------------------------------------------------------
# Render Blueprint — BACKEND ONLY
#
# This Blueprint intentionally creates ONLY the FastAPI backend web service.
# The database is an external pgvector-capable Neon Postgres (see
# docs/NEON_SETUP.md), and the frontend is deployed on Vercel (vercel.json).
# Do not add a Render `databases:` block here — Render Postgres may not expose
# the `vector` extension required by pgvector.
#
# Deploy: Render dashboard > New > Blueprint > connect the repo. You will be
# prompted for the sync:false secret values (DATABASE_URL, keys, access code).
#
# IMPORTANT — DATABASE_URL scheme:
#   Neon connection strings start with `postgresql://`. The app uses SQLAlchemy's
#   asyncpg driver and requires `postgresql+asyncpg://`. Change only the scheme.
#   URL-encode special characters in the password (e.g. @ -> %40).
# ---------------------------------------------------------------------------

services:
  # ------------------------------- Backend ---------------------------------
  - type: web
    name: darglobal-wasalt-backend
    runtime: docker
    plan: free # Free web services sleep after inactivity -> slow cold starts.
    region: oregon
    dockerfilePath: backend/Dockerfile
    # Both Dockerfiles COPY paths relative to the repository root.
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Tell Render's proxy which container port to route to. The backend
      # image defaults to 8000 and also honours PORT at runtime.
      - key: PORT
        value: "8000"

      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_V1_PREFIX
        value: /api/v1

      # Set this in the Render dashboard (sync: false keeps secrets out of the
      # blueprint). Use `postgresql+asyncpg://...`, see the notes above.
      - key: DATABASE_URL
        sync: false

      # Generate locally with:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      # Used by scripts/ingest.sh as the X-Admin-Key header.
      - key: ADMIN_API_KEY
        sync: false

      # Optional: set to a shared code if only the assessment owner should
      # chat. Leave unset for an open public demo.
      - key: APP_ACCESS_CODE
        sync: false

      # Must match the FRONTEND origin exactly (Vercel in the chosen topology).
      # Replace this placeholder with the real Vercel URL before the first chat.
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app

      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "12"

      # Local embeddings: no API key required, model downloads on first run.
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIM
        value: "384"
      - key: FASTEMBED_CACHE_PATH
        value: /app/data/fastembed

      # OpenRouter (OpenAI-compatible). Chat needs a real key; retrieval,
      # stats and search work without one.
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: LLM_API_KEY
        sync: false

      # Automatic fallback if OpenRouter runs out of credits or errors.
      - key: LLM_FALLBACK_PROVIDER
        value: groq
      - key: LLM_FALLBACK_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_FALLBACK_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: LLM_MAX_TOKENS
        value: "900"
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_HTTP_REFERER
        value: https://your-app.vercel.app
      - key: LLM_APP_NAME
        value: darglobal-wasalt-ai

# The frontend is deployed on Vercel (see vercel.json), not on Render.
# If an old "darglobal-wasalt-frontend" service still exists in this Render
# account from an earlier blueprint deploy, you can simply delete it.
