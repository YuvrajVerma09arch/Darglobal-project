# ---------------------------------------------------------------------------
# nginx config for the built Vite SPA.
# Installed as /etc/nginx/conf.d/default.conf, i.e. inside the http { } block,
# so http-context directives (gzip, map) are valid at the top of this file.
# The browser talks to the backend directly via VITE_API_BASE_URL; no /api
# reverse proxy is needed (and none is configured here).
# ---------------------------------------------------------------------------

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/x-javascript
    image/svg+xml;

# Vite fingerprints files under /assets/ -> safe to cache forever. Everything
# else (notably index.html) must be revalidated so new deploys are picked up.
map $uri $static_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (server level => inherited by every location) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;
    # `https:` in connect-src allows the Render backend URL without hardcoding
    # it here; localhost entries keep local Docker runs working.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Cache-Control $static_cache_control always;

    # Hashed build assets: serve directly, 404 on a missing asset (never fall
    # back to index.html for a .js/.css request).
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cheap container/ Render health endpoint (no upstream dependency).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
